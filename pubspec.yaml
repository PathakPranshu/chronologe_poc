name: chronologe_poc
description: "PoC for Chronologe: Let your day write itself."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+19
  intl: ^0.20.3
  material_color_utilities: ^0.13.0
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces_variable.ttf
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/roboto_flex_variable.ttf
