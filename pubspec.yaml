name: chronologe_poc
description: "PoC for Chronologe: Let your day write itself."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.13.0

dependencies:
  envied: ^1.3.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_fonts: ^8.2.1
  google_generative_ai: ^0.4.7
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.3
  intl: ^0.20.3
  material_color_utilities: ^0.13.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  table_calendar: ^3.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  envied_generator: ^1.3.8

flutter:
  uses-material-design: true
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces_variable.ttf
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/roboto_flex_variable.ttf